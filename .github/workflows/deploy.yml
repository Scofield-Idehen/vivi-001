name: Deploy

# Every push to main goes to staging, so the team always has the latest build to try:
# the web app on Firebase Hosting, the API and worker on Cloud Run, all in the one Google project.
# Migrations are not run here (the "Migrate" action does that, by hand, before a deploy that
# needs one). Set-up, once, is in docs/runbooks/hosting.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGION: europe-west1
  # The project id and the two public Supabase values may be kept as variables or as secrets.
  PROJECT: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}

jobs:
  web:
    name: Web app to Firebase Hosting
    # Hosting forwards /v1 to the API, so the API has to exist before the site is published.
    needs: services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Is hosting set up?
        run: |
          if [ -z "$PROJECT" ]; then
            echo "GCP_PROJECT_ID is not set (docs/runbooks/hosting.md). Nothing to deploy to yet."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          # Empty on purpose: Firebase Hosting forwards /v1 to the API, so the app calls its own address.
          VITE_API_URL: ''
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm --filter @v01/web build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          projectId: ${{ env.PROJECT }}
          channelId: live

  services:
    name: API and worker to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - name: Is hosting set up?
        run: |
          if [ -z "$PROJECT" ]; then
            echo "GCP_PROJECT_ID is not set (docs/runbooks/hosting.md). Nothing to deploy to yet."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Sign in to the image registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
      - name: Build and push the images
        env:
          REPO: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/v01
        run: |
          docker build -f apps/api/Dockerfile -t "$REPO/api:${GITHUB_SHA}" .
          docker push "$REPO/api:${GITHUB_SHA}"
          if [ "${{ vars.DEPLOY_WORKER }}" = "true" ]; then
            docker build -f apps/worker/Dockerfile -t "$REPO/worker:${GITHUB_SHA}" .
            docker push "$REPO/worker:${GITHUB_SHA}"
          fi
      # Each service's settings come from one GitHub secret holding its .env (KEY=VALUE lines),
      # turned into the YAML Cloud Run takes. Nothing secret is ever in this file or the image.
      - name: Write the services' settings
        env:
          API_ENV: ${{ secrets.API_ENV }}
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          DEPLOY_WORKER: ${{ vars.DEPLOY_WORKER }}
        shell: python3 {0}
        run: |
          import json, os, sys
          def to_yaml(text, out):
              lines = []
              for raw in (text or '').replace('\r', '').split('\n'):
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  if line.startswith('export '):
                      line = line[7:].strip()
                  key, value = line.split('=', 1)
                  key, value = key.strip(), value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in '"\'':
                      value = value[1:-1]
                  if key in ('PORT', 'HOST'):
                      continue
                  lines.append(f'{key}: {json.dumps(value)}')
              with open(out, 'w') as f:
                  f.write('\n'.join(lines) + '\n')
              return len(lines)
          n = to_yaml(os.environ.get('API_ENV'), 'api.env.yaml')
          if n == 0:
              sys.exit('The API_ENV secret is empty.')
          print(f'API: {n} settings')
          if os.environ.get('DEPLOY_WORKER') == 'true':
              m = to_yaml(os.environ.get('WORKER_ENV'), 'worker.env.yaml')
              if m == 0:
                  sys.exit('The WORKER_ENV secret is empty.')
              print(f'Worker: {m} settings')
      - name: Deploy the API
        id: api
        env:
          REPO: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/v01
        run: |
          gcloud run deploy v01-api \
            --image "$REPO/api:${GITHUB_SHA}" \
            --region "$REGION" --platform managed --allow-unauthenticated \
            --port 8080 --cpu 1 --memory 1Gi --min-instances "${{ vars.API_MIN_INSTANCES || 0 }}" --max-instances 3 \
            --env-vars-file api.env.yaml --quiet
      - name: Why the API didn't start
        if: ${{ failure() && steps.api.conclusion == 'failure' }}
        run: |
          echo "The container's last log lines:"
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="v01-api"' \
            --project "$PROJECT" --limit 40 --format 'value(textPayload,jsonPayload.message,jsonPayload.msg)' --freshness 20m || true
      # The worker runs its loops all day, so on Cloud Run it is one instance always on (about $15 a
      # month). Until DEPLOY_WORKER is true it stays where it is (a laptop, say) and nothing is charged.
      - name: Deploy the worker
        if: ${{ vars.DEPLOY_WORKER == 'true' }}
        env:
          REPO: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/v01
        run: |
          gcloud run deploy v01-worker \
            --image "$REPO/worker:${GITHUB_SHA}" \
            --region "$REGION" --platform managed --no-allow-unauthenticated \
            --port 8080 --cpu 1 --memory 1Gi --min-instances 1 --max-instances 1 --no-cpu-throttling \
            --env-vars-file worker.env.yaml --quiet
      - name: Where it is
        run: gcloud run services describe v01-api --region "$REGION" --format 'value(status.url)'
